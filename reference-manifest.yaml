# Reference data / engine compatibility matrix

engines:
  vep:
    release: "116"
    image_hint: "ensemblorg/ensembl-vep:release_116.0"
    cache_root_env: VEP_CACHE_DIR
    cache_root_default: data/vep
    assemblies:
      GRCh37:
        cache_subdir: "homo_sapiens_merged/116_GRCh37"
        download_script: "scripts/download_vep_cache.sh merged GRCh37"
        legacy_path: "legacy/online-tool/online-vep/cache/homo_sapiens_merged/116_GRCh37"
      GRCh38:
        cache_subdir: "homo_sapiens_merged/116_GRCh38"
        download_script: "BACKGROUND=1 bash scripts/download_vep_cache.sh merged GRCh38"
        download_log: "data/vep/.downloads/download_116_GRCh38.log"
  annovar:
    version_label: "2018-04-16"
    image_hint: "registry.cn-shanghai.aliyuncs.com/kszy-biosoft/annovar:v20180416_2"
    table_bin_in_image: "/home/TOOLS/tools/annovar/current/bin/table_annovar.pl"
    db_root_env: ANNOVAR_DB_DIR
    db_root_default: data/annovar/humandb
    assemblies:
      GRCh37:
        buildver: hg19
        required_files:
          - hg19_refGeneWithVer.txt
          - hg19_refGeneWithVerMrna.fa
      GRCh38:
        buildver: hg38
        required_files:
          - hg38_refGeneWithVer.txt
          - hg38_refGeneWithVerMrna.fa
    license_note: "Confirm redistribution/online-service rights before public exposure"

data_layout:
  - "data/vep -> VEP caches (homo_sapiens_merged/116_*)"
  - "data/vep/.downloads -> VEP tarballs + download logs"
  - "data/annovar/humandb -> ANNOVAR hg19_* + hg38_*"
