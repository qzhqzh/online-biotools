services:
  vep-api:
    build: .
    container_name: online-vep
    ports:
      - "8093:8089"
    volumes:
      - ./cache:/data/cache
      - ./data:/data/input
    environment:
      - VEP_CACHE_DIR=/data/cache
      - VEP_ASSEMBLY=GRCh37
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
