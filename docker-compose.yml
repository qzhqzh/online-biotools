services:
  web:
    build: .
    container_name: online-biotools-web
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      BIOTOOLS_API_KEYS: ${BIOTOOLS_API_KEYS:-}
      BIOTOOLS_REQUIRE_API_KEY: ${BIOTOOLS_REQUIRE_API_KEY:-0}
      BIOTOOLS_ANNOTATION_RATE: ${BIOTOOLS_ANNOTATION_RATE:-30/min}
      ANNOVAR_PUBLIC_ENABLED: ${ANNOVAR_PUBLIC_ENABLED:-0}
      VEP_BIN: /opt/vep/src/ensembl-vep/vep
      VEP_CACHE_DIR: /data/vep
      VEP_ASSEMBLY: GRCh37
      VEP_MAX_CONCURRENCY: "2"
      ANNOVAR_MODE: ${ANNOVAR_MODE:-docker}
      ANNOVAR_DB_DIR: /data/annovar
      ANNOVAR_DOCKER_IMAGE: ${ANNOVAR_DOCKER_IMAGE:-registry.cn-shanghai.aliyuncs.com/kszy-biosoft/annovar:v20180416_2}
      ANNOVAR_TABLE_BIN: /home/TOOLS/tools/annovar/current/bin/table_annovar.pl
    volumes:
      - ${VEP_HOST_CACHE:-./data/vep}:/data/vep:ro
      - ${ANNOVAR_HOST_DB:-./data/annovar-hg38}:/data/annovar:ro
      # Allow web container to run ANNOVAR via sibling docker image (optional)
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
