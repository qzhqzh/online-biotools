services:
  web:
    build: .
    container_name: online-biotools-web
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      VEP_BIN: /opt/vep/src/ensembl-vep/vep
      VEP_CACHE_DIR: /data/vep
      VEP_ASSEMBLY: GRCh37
      VEP_MAX_CONCURRENCY: "2"
    volumes:
      # Prefer ./data/vep; can symlink from legacy online-tool/online-vep/cache
      - ${VEP_HOST_CACHE:-./data/vep}:/data/vep:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
